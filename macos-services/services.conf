# Automator Quick Actions (Finder services), installed by install-services.sh.
#
# Format: menu name | app bundle id | send file types | shell command
#
# A service is only installed when its app is installed, and the icon shown in
# the Finder context menu is copied from that app bundle. "$*" and ${HOME} are
# expanded by the service when it runs, not while it is generated.
#
# Send file types: public.folder for folders only, public.item for any file.

Open in Ghostty|com.mitchellh.ghostty|public.folder|open -b com.mitchellh.ghostty "$*"
Open in Terminal|com.apple.Terminal|public.folder|open -b com.apple.terminal "$*"
Open In VS Code|com.microsoft.VSCode|public.item|open -n -b "com.microsoft.VSCode" --args "$*"
Open in IntelliJ IDEA|com.jetbrains.intellij|public.folder|"${HOME}/Library/Application Support/JetBrains/Toolbox/scripts/idea" "$*"
Open in Rider|com.jetbrains.rider|public.folder|"${HOME}/Library/Application Support/JetBrains/Toolbox/scripts/rider" "$*"
Open in Android Studio|com.google.android.studio|public.folder|"${HOME}/Library/Application Support/JetBrains/Toolbox/scripts/studio" "$*"
Open in Sourcetree|com.torusknot.SourceTreeNotMAS|public.folder|/Applications/Sourcetree.app/Contents/Resources/stree "$*"
Open in GitHub Desktop|com.github.GitHubClient|public.folder|"/Applications/GitHub Desktop.app/Contents/Resources/app/static/github.sh" "$*"
