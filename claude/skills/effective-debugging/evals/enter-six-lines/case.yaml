schema_version: "1.1"
name: enter-six-lines
expected_outcome: |
  A harness problem, not the app. idb's companion sends a key's down and up as two events, and on a busy runner sent the up 913 ms after the down. iOS took the key as held and repeated it every 105 ms past 400 ms, so one Enter made six lines. The fix presses keys through sim-finger, each event 10 ms after the last.
